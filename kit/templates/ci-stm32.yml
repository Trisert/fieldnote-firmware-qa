name: Firmware QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          set -euo pipefail
          # Replace with the project's pinned test dependencies.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Run host tests
        run: make test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analyzer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Run first-party analysis
        run: make cppcheck

  firmware-build:
    name: Target firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install target toolchain
        run: |
          set -euo pipefail
          # Pin the ARM GNU Toolchain version used by the project.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Build release
        run: make release
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-evidence
          path: |
            build/**/*.elf
            build/**/*.hex
            build/**/*.bin
            build/**/*.map
          if-no-files-found: error
